<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>파일 업로드 시퀀스 다이어그램</title>
  <desc>사용자가 파일을 업로드하는 시퀀스 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Lifelines headers -->
  <rect x="40" y="20" width="110" height="36" rx="6" fill="#185FA5"/>
  <text x="95" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">사용자</text>

  <rect x="210" y="20" width="110" height="36" rx="6" fill="#534AB7"/>
  <text x="265" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">웹 클라이언트</text>

  <rect x="380" y="20" width="110" height="36" rx="6" fill="#0F6E56"/>
  <text x="435" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">서버 (API)</text>

  <rect x="550" y="20" width="100" height="36" rx="6" fill="#BA7517"/>
  <text x="600" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">클라우드 DB</text>

  <!-- Lifeline vertical dashes -->
  <line x1="95" y1="56" x2="95" y2="460" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="265" y1="56" x2="265" y2="460" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="435" y1="56" x2="435" y2="460" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="600" y1="56" x2="600" y2="460" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Step 1: 사용자 → 웹 클라이언트 -->
  <line x1="95" y1="100" x2="258" y2="100" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">파일 선택 및 업로드 클릭</text>
  <rect x="85" y="92" width="20" height="16" rx="2" fill="#B5D4F4"/>
  <rect x="255" y="92" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- Step 2: 웹 클라이언트 → 서버 -->
  <line x1="265" y1="140" x2="428" y2="140" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">POST /api/files (파일 데이터)</text>
  <rect x="255" y="132" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="425" y="132" width="20" height="16" rx="2" fill="#9FE1CB"/>

  <!-- Step 3: 서버 → DB -->
  <line x1="435" y1="180" x2="593" y2="180" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">파일 저장 요청</text>
  <rect x="425" y="172" width="20" height="16" rx="2" fill="#9FE1CB"/>
  <rect x="590" y="172" width="20" height="16" rx="2" fill="#FAC775"/>

  <!-- Step 4: DB → 서버 (return) -->
  <line x1="590" y1="220" x2="457" y2="220" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ret)"/>
  <text x="522" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">저장 완료 (파일ID 반환)</text>
  <rect x="590" y="212" width="20" height="16" rx="2" fill="#FAC775"/>
  <rect x="425" y="212" width="20" height="16" rx="2" fill="#9FE1CB"/>

  <!-- Step 5: 서버 → 서버 (로그 기록) -->
  <rect x="415" y="248" width="40" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="435" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">로그 기록</text>

  <!-- Step 6: 서버 → 웹 클라이언트 (return) -->
  <line x1="425" y1="296" x2="287" y2="296" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ret)"/>
  <text x="354" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">200 OK (파일 메타데이터)</text>
  <rect x="425" y="288" width="20" height="16" rx="2" fill="#9FE1CB"/>
  <rect x="255" y="288" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- Step 7: 웹 클라이언트 → 사용자 -->
  <line x1="255" y1="336" x2="117" y2="336" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ret)"/>
  <text x="185" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">업로드 완료 알림</text>
  <rect x="255" y="328" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="85" y="328" width="20" height="16" rx="2" fill="#B5D4F4"/>

  <!-- Alt: 실패 케이스 -->
  <rect x="240" y="370" width="230" height="70" rx="4" fill="none" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="250" y="385" font-family="sans-serif" font-size="10" fill="#A32D2D" font-weight="500">alt [파일 형식 불일치 / 용량 초과]</text>
  <line x1="435" y1="400" x2="287" y2="400" stroke="#E24B4A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ret)"/>
  <text x="354" y="394" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#E24B4A">400 오류 메시지 반환</text>
  <rect x="425" y="392" width="20" height="16" rx="2" fill="#F7C1C1"/>
  <rect x="255" y="392" width="20" height="16" rx="2" fill="#F7C1C1"/>

  <!-- Step numbers -->
  <circle cx="130" cy="100" r="9" fill="#185FA5"/>
  <text x="130" y="104" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">1</text>
  <circle cx="300" cy="140" r="9" fill="#534AB7"/>
  <text x="300" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">2</text>
  <circle cx="470" cy="180" r="9" fill="#0F6E56"/>
  <text x="470" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">3</text>
  <circle cx="555" cy="220" r="9" fill="#BA7517"/>
  <text x="555" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">4</text>
  <circle cx="395" cy="296" r="9" fill="#0F6E56"/>
  <text x="395" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">5</text>
  <circle cx="225" cy="336" r="9" fill="#534AB7"/>
  <text x="225" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">6</text>
</svg>
