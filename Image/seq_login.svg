<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>로그인 시퀀스 다이어그램</title>
  <desc>사용자 로그인 처리 시퀀스 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Headers -->
  <rect x="40" y="20" width="110" height="36" rx="6" fill="#185FA5"/>
  <text x="95" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">사용자</text>
  <rect x="220" y="20" width="120" height="36" rx="6" fill="#534AB7"/>
  <text x="280" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">웹 클라이언트</text>
  <rect x="420" y="20" width="120" height="36" rx="6" fill="#0F6E56"/>
  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">인증 서버</text>

  <!-- Lifelines -->
  <line x1="95" y1="56" x2="95" y2="390" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="280" y1="56" x2="280" y2="390" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="480" y1="56" x2="480" y2="390" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 1: 사용자 → 웹 -->
  <line x1="95" y1="100" x2="272" y2="100" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="183" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">이메일 / 비밀번호 입력</text>
  <rect x="85" y="92" width="20" height="16" rx="2" fill="#B5D4F4"/>
  <rect x="268" y="92" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- 2: 웹 → 서버 -->
  <line x1="280" y1="140" x2="413" y2="140" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="346" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">POST /api/auth/login</text>
  <rect x="268" y="132" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="410" y="132" width="20" height="16" rx="2" fill="#9FE1CB"/>

  <!-- 3: 서버 내부 처리 -->
  <rect x="460" y="160" width="40" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="480" y="176" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">자격증명 확인</text>

  <!-- Success path -->
  <line x1="410" y1="216" x2="292" y2="216" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="348" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">200 OK + JWT 토큰</text>
  <rect x="410" y="208" width="20" height="16" rx="2" fill="#9FE1CB"/>
  <rect x="268" y="208" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- 웹 → 사용자 성공 -->
  <line x1="268" y1="256" x2="107" y2="256" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="186" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">메인 화면 이동</text>
  <rect x="268" y="248" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="85" y="248" width="20" height="16" rx="2" fill="#B5D4F4"/>

  <!-- Alt: 실패 -->
  <rect x="258" y="280" width="196" height="80" rx="4" fill="none" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="268" y="296" font-family="sans-serif" font-size="10" fill="#A32D2D" font-weight="500">alt [인증 실패]</text>
  <line x1="410" y1="315" x2="292" y2="315" stroke="#E24B4A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="348" y="309" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#E24B4A">401 인증 실패 응답</text>
  <rect x="410" y="307" width="20" height="16" rx="2" fill="#F7C1C1"/>
  <rect x="268" y="307" width="20" height="16" rx="2" fill="#F7C1C1"/>
  <text x="275" y="352" font-family="sans-serif" font-size="10" fill="#A32D2D">→ 오류 메시지 표시</text>

  <!-- Step numbers -->
  <circle cx="135" cy="100" r="9" fill="#185FA5"/>
  <text x="135" y="104" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">1</text>
  <circle cx="316" cy="140" r="9" fill="#534AB7"/>
  <text x="316" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">2</text>
  <circle cx="373" cy="216" r="9" fill="#0F6E56"/>
  <text x="373" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">3</text>
  <circle cx="230" cy="256" r="9" fill="#534AB7"/>
  <text x="230" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">4</text>
</svg>
