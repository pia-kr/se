<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mini Drive UseCase Diagram</title>
  <desc>Mini Drive 시스템의 UseCase 다이어그램 - 사용자와 관리자 액터의 유스케이스를 보여줍니다</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- System boundary -->
  <rect x="140" y="20" width="480" height="580" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="380" y="48" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#444441">Mini Drive 시스템</text>

  <!-- Actor: 사용자 (left) -->
  <!-- Head -->
  <circle cx="60" cy="100" r="18" fill="none" stroke="#185FA5" stroke-width="1.5"/>
  <!-- Body -->
  <line x1="60" y1="118" x2="60" y2="160" stroke="#185FA5" stroke-width="1.5"/>
  <!-- Arms -->
  <line x1="30" y1="138" x2="90" y2="138" stroke="#185FA5" stroke-width="1.5"/>
  <!-- Legs -->
  <line x1="60" y1="160" x2="35" y2="190" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="60" y1="160" x2="85" y2="190" stroke="#185FA5" stroke-width="1.5"/>
  <text x="60" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#185FA5" font-weight="500">사용자</text>

  <!-- Actor: 관리자 (left, lower) -->
  <circle cx="60" cy="420" r="18" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="60" y1="438" x2="60" y2="480" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="30" y1="458" x2="90" y2="458" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="60" y1="480" x2="35" y2="510" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="60" y1="480" x2="85" y2="510" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="60" y="530" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0F6E56" font-weight="500">관리자</text>

  <!-- Use Cases - 사용자 -->
  <!-- UC1: 회원가입 -->
  <ellipse cx="310" cy="90" rx="90" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="310" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0C447C">회원가입</text>

  <!-- UC2: 로그인 -->
  <ellipse cx="310" cy="155" rx="90" ry="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="310" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0C447C">로그인</text>

  <!-- UC3: 파일 업로드/다운로드 -->
  <ellipse cx="490" cy="110" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">파일 업로드 / 다운로드</text>

  <!-- UC4: 폴더 관리 -->
  <ellipse cx="490" cy="175" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">폴더 관리</text>

  <!-- UC5: 파일 공유 -->
  <ellipse cx="490" cy="240" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">파일 공유 및 권한 설정</text>

  <!-- UC6: 외부 공유 링크 -->
  <ellipse cx="490" cy="305" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="310" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">외부 공유 링크 생성</text>

  <!-- UC7: 파일 검색 -->
  <ellipse cx="490" cy="370" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">파일 검색</text>

  <!-- UC8: 버전 관리 -->
  <ellipse cx="490" cy="435" rx="105" ry="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#085041">버전 관리</text>

  <!-- UC9: 로그 조회 (관리자 전용) -->
  <ellipse cx="310" cy="500" rx="90" ry="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="310" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3C3489">로그 조회</text>

  <!-- UC10: 사용자 계정 관리 (관리자 전용) -->
  <ellipse cx="310" cy="560" rx="90" ry="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="310" y="565" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3C3489">사용자 계정 관리</text>

  <!-- 사용자 → 회원가입 -->
  <line x1="78" y1="100" x2="218" y2="90" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 로그인 -->
  <line x1="78" y1="110" x2="218" y2="150" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 파일 업로드 -->
  <line x1="78" y1="120" x2="383" y2="110" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 폴더 관리 -->
  <line x1="78" y1="130" x2="383" y2="175" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 파일 공유 -->
  <line x1="78" y1="140" x2="383" y2="240" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 파일 검색 -->
  <line x1="78" y1="150" x2="383" y2="370" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 사용자 → 버전 관리 -->
  <line x1="78" y1="158" x2="383" y2="435" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 관리자 → 로그인 -->
  <line x1="78" y1="430" x2="218" y2="160" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 관리자 → 사용자 계정 관리 -->
  <line x1="78" y1="470" x2="218" y2="560" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 관리자 → 로그 조회 -->
  <line x1="78" y1="460" x2="218" y2="500" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 관리자 → 외부 공유 링크 -->
  <line x1="78" y1="440" x2="383" y2="305" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="155" y="576" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="172" y="587" font-family="sans-serif" font-size="11" fill="#444441">공통 기능</text>
  <rect x="255" y="576" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="272" y="587" font-family="sans-serif" font-size="11" fill="#444441">파일 관련 기능</text>
  <rect x="375" y="576" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="392" y="587" font-family="sans-serif" font-size="11" fill="#444441">관리자 전용 기능</text>
</svg>
