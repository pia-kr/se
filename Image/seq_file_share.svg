<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>파일 공유 시퀀스 다이어그램</title>
  <desc>사용자가 파일을 공유하고 권한을 설정하는 시퀀스</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Headers -->
  <rect x="30" y="20" width="100" height="36" rx="6" fill="#185FA5"/>
  <text x="80" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">사용자</text>
  <rect x="200" y="20" width="120" height="36" rx="6" fill="#534AB7"/>
  <text x="260" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">웹 클라이언트</text>
  <rect x="390" y="20" width="110" height="36" rx="6" fill="#0F6E56"/>
  <text x="445" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">서버 (API)</text>
  <rect x="560" y="20" width="100" height="36" rx="6" fill="#993C1D"/>
  <text x="610" y="42" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#fff">이메일 서비스</text>

  <!-- Lifelines -->
  <line x1="80"  y1="56" x2="80"  y2="390" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="260" y1="56" x2="260" y2="390" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="445" y1="56" x2="445" y2="390" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="610" y1="56" x2="610" y2="390" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- 1: 공유 대상/권한 설정 -->
  <line x1="80" y1="100" x2="252" y2="100" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="165" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">대상 이메일 / 권한 선택</text>
  <rect x="70" y="92" width="20" height="16" rx="2" fill="#B5D4F4"/>
  <rect x="248" y="92" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- 2: POST 공유 요청 -->
  <line x1="260" y1="140" x2="437" y2="140" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="348" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">POST /api/files/{id}/share</text>
  <rect x="248" y="132" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="433" y="132" width="20" height="16" rx="2" fill="#9FE1CB"/>

  <!-- 3: 서버 - 공유 레코드 저장 -->
  <rect x="425" y="158" width="40" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="445" y="175" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">공유 저장</text>

  <!-- 4: 링크 생성 옵션인 경우 이메일 발송 -->
  <line x1="445" y1="210" x2="602" y2="210" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="523" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">공유 알림 이메일 발송</text>
  <rect x="433" y="202" width="20" height="16" rx="2" fill="#9FE1CB"/>
  <rect x="598" y="202" width="20" height="16" rx="2" fill="#F0997B"/>

  <!-- 5: 이메일 서비스 → 서버 -->
  <line x1="598" y1="250" x2="465" y2="250" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="530" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">발송 완료</text>
  <rect x="598" y="242" width="20" height="16" rx="2" fill="#F0997B"/>
  <rect x="433" y="242" width="20" height="16" rx="2" fill="#9FE1CB"/>

  <!-- 6: 서버 → 클라이언트 -->
  <line x1="433" y1="290" x2="278" y2="290" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="354" y="283" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">200 OK (공유 링크 반환)</text>
  <rect x="433" y="282" width="20" height="16" rx="2" fill="#9FE1CB"/>
  <rect x="248" y="282" width="20" height="16" rx="2" fill="#CECBF6"/>

  <!-- 7: 클라이언트 → 사용자 -->
  <line x1="248" y1="330" x2="102" y2="330" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="172" y="323" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">공유 완료 표시</text>
  <rect x="248" y="322" width="20" height="16" rx="2" fill="#CECBF6"/>
  <rect x="70" y="322" width="20" height="16" rx="2" fill="#B5D4F4"/>

  <!-- Step numbers -->
  <circle cx="118" cy="100" r="9" fill="#185FA5"/>
  <text x="118" y="104" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">1</text>
  <circle cx="298" cy="140" r="9" fill="#534AB7"/>
  <text x="298" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">2</text>
  <circle cx="483" cy="210" r="9" fill="#0F6E56"/>
  <text x="483" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">3</text>
  <circle cx="567" cy="250" r="9" fill="#993C1D"/>
  <text x="567" y="254" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">4</text>
  <circle cx="383" cy="290" r="9" fill="#0F6E56"/>
  <text x="383" y="294" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">5</text>
  <circle cx="213" cy="330" r="9" fill="#534AB7"/>
  <text x="213" y="334" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fff">6</text>
</svg>
