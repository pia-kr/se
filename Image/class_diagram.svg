<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mini Drive 클래스 다이어그램</title>
  <desc>Mini Drive 시스템의 정적 분석 클래스 다이어그램</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="agg" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="5,1 9,5 5,9 1,5" fill="none" stroke="context-stroke" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ── 사용자 ── -->
  <rect x="30" y="30" width="160" height="130" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <rect x="30" y="30" width="160" height="28" rx="4" fill="#185FA5"/>
  <text x="110" y="49" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">사용자</text>
  <line x1="30" y1="58" x2="190" y2="58" stroke="#185FA5" stroke-width="0.8"/>
  <text x="40" y="76" font-family="sans-serif" font-size="11" fill="#0C447C">- 이메일 : String</text>
  <text x="40" y="93" font-family="sans-serif" font-size="11" fill="#0C447C">- 비밀번호 : String</text>
  <text x="40" y="110" font-family="sans-serif" font-size="11" fill="#0C447C">- 이름 : String</text>
  <line x1="30" y1="118" x2="190" y2="118" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="40" y="134" font-family="sans-serif" font-size="11" fill="#0C447C">+ 로그인() : void</text>
  <text x="40" y="151" font-family="sans-serif" font-size="11" fill="#0C447C">+ 회원가입() : void</text>

  <!-- ── 관리자 ── -->
  <rect x="490" y="30" width="170" height="130" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="490" y="30" width="170" height="28" rx="4" fill="#0F6E56"/>
  <text x="575" y="49" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">관리자</text>
  <line x1="490" y1="58" x2="660" y2="58" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="500" y="76" font-family="sans-serif" font-size="11" fill="#085041">- 관리자ID : String</text>
  <text x="500" y="93" font-family="sans-serif" font-size="11" fill="#085041">- 권한레벨 : Integer</text>
  <line x1="490" y1="101" x2="660" y2="101" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="500" y="118" font-family="sans-serif" font-size="11" fill="#085041">+ 계정관리() : void</text>
  <text x="500" y="135" font-family="sans-serif" font-size="11" fill="#085041">+ 로그조회() : void</text>
  <text x="500" y="152" font-family="sans-serif" font-size="11" fill="#085041">+ 시스템설정() : void</text>

  <!-- ── 파일 ── -->
  <rect x="260" y="30" width="170" height="150" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="260" y="30" width="170" height="28" rx="4" fill="#534AB7"/>
  <text x="345" y="49" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">파일</text>
  <line x1="260" y1="58" x2="430" y2="58" stroke="#534AB7" stroke-width="0.8"/>
  <text x="270" y="76" font-family="sans-serif" font-size="11" fill="#3C3489">- 파일ID : Integer</text>
  <text x="270" y="93" font-family="sans-serif" font-size="11" fill="#3C3489">- 파일명 : String</text>
  <text x="270" y="110" font-family="sans-serif" font-size="11" fill="#3C3489">- 크기 : Long</text>
  <text x="270" y="127" font-family="sans-serif" font-size="11" fill="#3C3489">- 업로드일시 : DateTime</text>
  <line x1="260" y1="135" x2="430" y2="135" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="270" y="152" font-family="sans-serif" font-size="11" fill="#3C3489">+ 업로드() : void</text>
  <text x="270" y="169" font-family="sans-serif" font-size="11" fill="#3C3489">+ 다운로드() : void</text>

  <!-- ── 폴더 ── -->
  <rect x="30" y="270" width="170" height="150" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <rect x="30" y="270" width="170" height="28" rx="4" fill="#BA7517"/>
  <text x="115" y="289" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">폴더</text>
  <line x1="30" y1="298" x2="200" y2="298" stroke="#BA7517" stroke-width="0.8"/>
  <text x="40" y="316" font-family="sans-serif" font-size="11" fill="#633806">- 폴더ID : Integer</text>
  <text x="40" y="333" font-family="sans-serif" font-size="11" fill="#633806">- 폴더명 : String</text>
  <text x="40" y="350" font-family="sans-serif" font-size="11" fill="#633806">- 상위폴더ID : Integer</text>
  <line x1="30" y1="358" x2="200" y2="358" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="40" y="374" font-family="sans-serif" font-size="11" fill="#633806">+ 생성() : void</text>
  <text x="40" y="391" font-family="sans-serif" font-size="11" fill="#633806">+ 삭제() : void</text>
  <text x="40" y="408" font-family="sans-serif" font-size="11" fill="#633806">+ 이름수정() : void</text>

  <!-- ── 공유설정 ── -->
  <rect x="260" y="270" width="170" height="155" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <rect x="260" y="270" width="170" height="28" rx="4" fill="#993C1D"/>
  <text x="345" y="289" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">공유설정</text>
  <line x1="260" y1="298" x2="430" y2="298" stroke="#993C1D" stroke-width="0.8"/>
  <text x="270" y="316" font-family="sans-serif" font-size="11" fill="#712B13">- 공유ID : Integer</text>
  <text x="270" y="333" font-family="sans-serif" font-size="11" fill="#712B13">- 권한타입 : Enum</text>
  <text x="270" y="350" font-family="sans-serif" font-size="11" fill="#712B13">- 만료일시 : DateTime</text>
  <text x="270" y="367" font-family="sans-serif" font-size="11" fill="#712B13">- 링크URL : String</text>
  <line x1="260" y1="375" x2="430" y2="375" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="270" y="392" font-family="sans-serif" font-size="11" fill="#712B13">+ 링크생성() : void</text>
  <text x="270" y="409" font-family="sans-serif" font-size="11" fill="#712B13">+ 권한변경() : void</text>

  <!-- ── 버전 ── -->
  <rect x="490" y="270" width="170" height="155" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <rect x="490" y="270" width="170" height="28" rx="4" fill="#3B6D11"/>
  <text x="575" y="289" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">버전</text>
  <line x1="490" y1="298" x2="660" y2="298" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="500" y="316" font-family="sans-serif" font-size="11" fill="#27500A">- 버전ID : Integer</text>
  <text x="500" y="333" font-family="sans-serif" font-size="11" fill="#27500A">- 버전번호 : Integer</text>
  <text x="500" y="350" font-family="sans-serif" font-size="11" fill="#27500A">- 변경일시 : DateTime</text>
  <text x="500" y="367" font-family="sans-serif" font-size="11" fill="#27500A">- 변경자ID : String</text>
  <line x1="490" y1="375" x2="660" y2="375" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="500" y="392" font-family="sans-serif" font-size="11" fill="#27500A">+ 복원() : void</text>
  <text x="500" y="409" font-family="sans-serif" font-size="11" fill="#27500A">+ 조회() : void</text>

  <!-- ── 로그 ── -->
  <rect x="260" y="540" width="170" height="140" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="260" y="540" width="170" height="28" rx="4" fill="#5F5E5A"/>
  <text x="345" y="559" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#ffffff">접근로그</text>
  <line x1="260" y1="568" x2="430" y2="568" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="270" y="586" font-family="sans-serif" font-size="11" fill="#2C2C2A">- 로그ID : Integer</text>
  <text x="270" y="603" font-family="sans-serif" font-size="11" fill="#2C2C2A">- 사용자ID : String</text>
  <text x="270" y="620" font-family="sans-serif" font-size="11" fill="#2C2C2A">- 작업내용 : String</text>
  <text x="270" y="637" font-family="sans-serif" font-size="11" fill="#2C2C2A">- 접근시간 : DateTime</text>
  <line x1="260" y1="645" x2="430" y2="645" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="270" y="661" font-family="sans-serif" font-size="11" fill="#2C2C2A">+ 기록() : void</text>
  <text x="270" y="678" font-family="sans-serif" font-size="11" fill="#2C2C2A">+ 조회() : void</text>

  <!-- Relationships -->
  <!-- 사용자 → 파일 (1 to *) -->
  <line x1="190" y1="80" x2="258" y2="80" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="200" y="74" font-family="sans-serif" font-size="10" fill="#888780">1</text>
  <text x="238" y="74" font-family="sans-serif" font-size="10" fill="#888780">*</text>

  <!-- 파일 → 관리자 (관리) -->
  <line x1="432" y1="80" x2="488" y2="80" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 사용자 → 폴더 -->
  <line x1="110" y1="160" x2="110" y2="268" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="116" y="218" font-family="sans-serif" font-size="10" fill="#888780">1..*</text>

  <!-- 폴더 → 파일 -->
  <line x1="200" y1="345" x2="258" y2="130" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 파일 → 공유설정 -->
  <line x1="345" y1="180" x2="345" y2="268" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="228" font-family="sans-serif" font-size="10" fill="#888780">1..*</text>

  <!-- 파일 → 버전 -->
  <line x1="432" y1="130" x2="488" y2="310" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="462" y="238" font-family="sans-serif" font-size="10" fill="#888780">1..*</text>

  <!-- 파일 → 로그 -->
  <line x1="345" y1="425" x2="345" y2="538" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 관계 레이블 -->
  <text x="193" y="67" font-family="sans-serif" font-size="10" fill="#5F5E5A">업로드</text>
  <text x="112" y="200" font-family="sans-serif" font-size="10" fill="#5F5E5A">소유</text>
</svg>
