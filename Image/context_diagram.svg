<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mini Drive 소프트웨어 컨텍스트 다이어그램</title>
  <desc>Mini Drive 시스템의 외부 액터 및 시스템 경계를 보여주는 컨텍스트 다이어그램</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Central system -->
  <rect x="220" y="150" width="240" height="100" rx="14" fill="#185FA5" stroke="#0C447C" stroke-width="1.5"/>
  <text x="340" y="193" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#fff">Mini Drive</text>
  <text x="340" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B5D4F4">클라우드 파일 공유 시스템</text>

  <!-- Actor: 사용자 (left) -->
  <circle cx="70" cy="200" r="22" fill="none" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="70" y1="222" x2="70" y2="260" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="46" y1="242" x2="94" y2="242" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="48" y2="288" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="70" y1="260" x2="92" y2="288" stroke="#534AB7" stroke-width="1.5"/>
  <text x="70" y="308" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#534AB7">사용자</text>

  <!-- Actor: 관리자 (left-bottom) -->
  <circle cx="70" cy="340" r="22" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="70" y1="362" x2="70" y2="395" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="46" y1="378" x2="94" y2="378" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="70" y1="395" x2="48" y2="415" stroke="#0F6E56" stroke-width="1.5"/>
  <line x1="70" y1="395" x2="92" y2="415" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="70" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0F6E56">관리자</text>

  <!-- External: 이메일 시스템 (top) -->
  <rect x="270" y="30" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489">외부 이메일 서비스</text>
  <text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">SMTP / API</text>

  <!-- External: 클라우드 스토리지 (right) -->
  <rect x="540" y="150" width="130" height="55" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="605" y="173" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">클라우드 스토리지</text>
  <text x="605" y="191" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0F6E56">S3 / GCS</text>

  <!-- External: 인증 서버 (right-bottom) -->
  <rect x="540" y="260" width="130" height="55" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="605" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806">인증 서버</text>
  <text x="605" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BA7517">JWT / OAuth 2.0</text>

  <!-- Arrows -->
  <!-- 사용자 → 시스템 -->
  <line x1="92" y1="200" x2="218" y2="196" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">파일 관리 요청</text>

  <!-- 시스템 → 사용자 -->
  <line x1="220" y1="210" x2="94" y2="210" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="155" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888780">파일 / 알림 응답</text>

  <!-- 관리자 → 시스템 -->
  <line x1="92" y1="340" x2="218" y2="240" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="138" y="308" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0F6E56">시스템 관리</text>

  <!-- 시스템 → 이메일 -->
  <line x1="340" y1="150" x2="340" y2="82" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="358" y="120" font-family="sans-serif" font-size="10" fill="#888780">이메일 발송</text>

  <!-- 시스템 → 스토리지 -->
  <line x1="460" y1="185" x2="538" y2="178" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="497" y="171" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0F6E56">파일 저장/조회</text>

  <!-- 시스템 → 인증서버 -->
  <line x1="460" y1="215" x2="538" y2="268" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="257" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#BA7517">인증 요청</text>
</svg>
